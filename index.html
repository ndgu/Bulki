<body>

  <div class="header">

  <div class="gallery-container" id="gallery"></div>

  <!-- Lightbox -->

    <div class="lightbox-img-wrap" id="lightboxWrap">
      <img class="lightbox-img" id="lightboxImg" src="" alt="" draggable="false">
    </div>
    <div class="zoom-hint">👆 اضغط مرتين أو قرّب بإصبعيك</div>
  </div>

  <script>
    const images = [
      'IMG_20260904_003230_227.jpg',
      'IMG_20260904_003230_390.jpg',
      'IMG_20260904_003230_510.jpg',
      'IMG_20260904_003230_563.jpg',
      'IMG_20260904_003230_564.jpg',
      'IMG_20260904_003230_682.jpg',
      'IMG_20260904_003230_689.jpg',
      'IMG_20260904_003230_694.jpg',
      'IMG_20260904_003231_101.jpg',
      'IMG_20260904_003231_138.jpg',
      'IMG_20260904_003233_614.jpg'
    ];

    const gallery = document.getElementById('gallery');
    const countBadge = document.getElementById('countBadge');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxWrap = document.getElementById('lightboxWrap');
    let currentIndex = 0;

    // ====== عرض الصور ======
    images.forEach((src, index) => {
      const card = document.createElement('div');
      card.className = 'watch-card';
      card.onclick = () => openLightbox(index);
      card.innerHTML = `
        <span class="click-hint">🔍 تكبير</span>
        <div class="img-wrap">
          <img src="${src}" alt="ساعة ${index + 1}" loading="lazy">
        </div>
        <div class="watch-info">
          <h3>ساعة #${index + 1}</h3>
          <p>${src}</p>
          <span class="price-tag">عرض مميز</span>
        </div>
      `;
      gallery.appendChild(card);
    });

    countBadge.textContent = images.length + ' صورة';

    // ====== Lightbox ======
    function openLightbox(index) {
      currentIndex = index;
      resetZoom();
      lightboxImg.src = images[currentIndex];
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
      setTimeout(resetZoom, 300);
    }

    function nextImage() {
      currentIndex = (currentIndex + 1) % images.length;
      resetZoom();
      lightboxImg.src = images[currentIndex];
    }

    function prevImage() {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      resetZoom();
      lightboxImg.src = images[currentIndex];
    }

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox || e.target === lightboxWrap) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') nextImage();
      if (e.key === 'ArrowLeft') prevImage();
    });

    // ====== Pinch-to-Zoom + Pan ======
    let scale = 1, panning = false, pointX = 0, pointY = 0, startX = 0, startY = 0;
    let lastScale = 1, lastPointX = 0, lastPointY = 0;

    function resetZoom() {
      scale = 1;
      pointX = 0;
      pointY = 0;
      lastScale = 1;
      lastPointX = 0;
      lastPointY = 0;
      updateTransform();
      lightboxImg.classList.remove('zoomed');
    }

    function updateTransform() {
      lightboxImg.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
    }

    // Double tap to zoom
    let lastTap = 0;
    lightboxImg.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTap < 300) {
        e.preventDefault();
        if (scale > 1) {
          resetZoom();
        } else {
          scale = 2.5;
          lightboxImg.classList.add('zoomed');
          updateTransform();
        }
      }
      lastTap = now;
    });

    // Pinch zoom
    lightboxWrap.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        lastScale = Math.sqrt(dx * dx + dy * dy);
        lastPointX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        lastPointY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      } else if (e.touches.length === 1 && scale > 1) {
        panning = true;
        startX = e.touches[0].clientX - pointX;
        startY = e.touches[0].clientY - pointY;
      }
    }, { passive: false });

    lightboxWrap.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const newScale = Math.min(Math.max(scale * (dist / lastScale), 1), 5);
        scale = newScale;
        lastScale = dist;
        if (scale > 1) lightboxImg.classList.add('zoomed');
        else lightboxImg.classList.remove('zoomed');
        updateTransform();
      } else if (e.touches.length === 1 && panning && scale > 1) {
        e.preventDefault();
        pointX = e.touches[0].clientX - startX;
        pointY = e.touches[0].clientY - startY;
        updateTransform();
      }
    }, { passive: false });

    lightboxWrap.addEventListener('touchend', () => {
      panning = false;
      if (scale < 1) { scale = 1; lightboxImg.classList.remove('zoomed'); updateTransform(); }
    });

    // Mouse wheel zoom (desktop)
    lightboxWrap.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.9 : 1.1;
      scale = Math.min(Math.max(scale * delta, 1), 5);
      if (scale > 1) lightboxImg.classList.add('zoomed');
      else lightboxImg.classList.remove('zoomed');
      updateTransform();
    }, { passive: false });

    // Mouse drag pan (desktop)
    lightboxWrap.addEventListener('mousedown', (e) => {
      if (scale > 1) {
        panning = true;
        startX = e.clientX - pointX;
        startY = e.clientY - pointY;
        lightboxImg.style.cursor = 'grabbing';
      }
    });
    window.addEventListener('mousemove', (e) => {
      if (panning && scale > 1) {
        pointX = e.clientX - startX;
        pointY = e.clientY - startY;
        updateTransform();
      }
    });
    window.addEventListener('mouseup', () => {
      panning = false;
      lightboxImg.style.cursor = scale > 1 ? 'grab' : 'default';
    });

    // Swipe to navigate
    let touchStartX = 0;
    lightboxWrap.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1 && scale <= 1) {
        touchStartX = e.touches[0].screenX;
      }
    }, { passive: true });
    lightboxWrap.addEventListener('touchend', (e) => {
      if (scale > 1) return;
      const diff = touchStartX - e.changedTouches[0].screenX;
      if (Math.abs(diff) > 60) {
        if (diff > 0) nextImage();
        else prevImage();
      }
    }, { passive: true });

    // ====== تأثير الكريف ======
    function animateOnScroll() {
      const cards = document.querySelectorAll('.watch-card');
      if (cards.length === 0) return;
      const containerRect = gallery.getBoundingClientRect();
      cards.forEach((card) => {
        const rect = card.getBoundingClientRect();
        const cardCenter = rect.top + rect.height / 2;
        const containerCenter = containerRect.top + containerRect.height / 2;
        const distance = cardCenter - containerCenter;
        const maxDistance = containerRect.height / 2 + 50;
        const normalizedDist = Math.max(-1, Math.min(1, distance / maxDistance));
        const scale = 1 - Math.abs(normalizedDist) * 0.15;
        const rotateX = normalizedDist * 8;
        const opacity = 1 - Math.abs(normalizedDist) * 0.4;
        const blur = Math.abs(normalizedDist) * 1.5;
        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) scale(${scale})`;
        card.style.opacity = opacity;
        card.style.filter = `blur(${blur}px)`;
      });
    }

    gallery.addEventListener('scroll', animateOnScroll);
    window.addEventListener('resize', animateOnScroll);
    window.addEventListener('load', animateOnScroll);
    setTimeout(animateOnScroll, 100);
  </script>

</body>
</html>'''
