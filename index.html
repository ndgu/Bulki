  <?php
    $folder = 'images/';
    $allowed = ['jpg', 'jpeg', 'png', 'webp', 'gif'];
    $images = [];

    if (is_dir($folder)) {
      $files = scandir($folder);
      foreach ($files as $file) {
        $ext = strtolower(pathinfo($file, PATHINFO_EXTENSION));
        if (in_array($ext, $allowed)) {
          $images[] = $folder . $file;
        }
      }
    }
  ?>

  <div class="count-badge" id="countBadge">
    <?= count($images) ?> صورة
  </div>

  <div class="gallery-container" id="gallery">
    <?php if (count($images) === 0): ?>
      <div class="empty-state">
        <h2>📁 مجلد images/ فارغ</h2>
        <p>ارفع صورك داخل مجلد images/ في الاستضافة</p>
      </div>
    <?php else: ?>
      <?php foreach ($images as $index => $img): ?>
        <div class="watch-card">
          <img src="<?= htmlspecialchars($img) ?>" alt="ساعة <?= $index + 1 ?>">
          <div class="watch-info">
            <h3>ساعة #<?= $index + 1 ?></h3>
            <p><?= htmlspecialchars(basename($img)) ?></p>
            <span class="price-tag">عرض مميز</span>
          </div>
        </div>
      <?php endforeach; ?>
    <?php endif; ?>
  </div>

  <script>
    const gallery = document.getElementById('gallery');
    const countBadge = document.getElementById('countBadge');

    // ====== تأثير الكريف (Curve) عند التمرير ======
    function animateOnScroll() {
      const cards = document.querySelectorAll('.watch-card');
      if (cards.length === 0) return;

      const containerRect = gallery.getBoundingClientRect();

      cards.forEach((card) => {
        const rect = card.getBoundingClientRect();
        const cardCenter = rect.top + rect.height / 2;
        const containerCenter = containerRect.top + containerRect.height / 2;
        const distance = cardCenter - containerCenter;
        const maxDistance = containerRect.height / 2 + 50;

        // منحنى الكريف: كلما ابتعدت الصورة عن المنتصف
        const normalizedDist = Math.max(-1, Math.min(1, distance / maxDistance));
        const scale = 1 - Math.abs(normalizedDist) * 0.15;
        const rotateX = normalizedDist * 8;
        const opacity = 1 - Math.abs(normalizedDist) * 0.4;
        const blur = Math.abs(normalizedDist) * 1.5;

        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) scale(${scale})`;
        card.style.opacity = opacity;
        card.style.filter = `blur(${blur}px)`;
      });
    }

    gallery.addEventListener('scroll', animateOnScroll);
    window.addEventListener('resize', animateOnScroll);
    window.addEventListener('load', animateOnScroll);

    // أول تشغيل
    setTimeout(animateOnScroll, 100);
  </script>
